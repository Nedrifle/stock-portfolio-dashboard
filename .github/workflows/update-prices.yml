name: 株価取得とGitHub Pages公開
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      symbols:
        description: '追加取得する証券コード（例：7203.T,6758.T）。株数や取得価額は入力しません。'
        required: false
        default: ''
  schedule:
    # JST 09:02–15:47, every 15 minutes; allow delayed runs to catch up.
    - cron: '2,17,32,47 0-6 * * 1-5'
    - cron: '17 9 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stockfolio-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 休場日判定ライブラリ
        run: pip install -r requirements.txt
      - name: 取引日と更新モードを判定
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
        run: python3 scripts/market_calendar.py
      - name: 計算と株価変換のテスト
        if: steps.plan.outputs.run == 'true'
        run: |
          node --test tests/*.test.js
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Yahooの直近株価と確定終値を更新
        if: steps.plan.outputs.run == 'true'
        env:
          REQUESTED_SYMBOLS: ${{ inputs.symbols || '' }}
        run: python3 scripts/update_prices.py --mode '${{ steps.plan.outputs.mode }}'
      - name: 公開株価キャッシュと取得対象コードだけを保存
        id: cache
        if: steps.plan.outputs.run == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash scripts/save_prices.sh
      - uses: actions/configure-pages@v5
        if: steps.plan.outputs.run == 'true' && steps.cache.outputs.stale != 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.plan.outputs.run == 'true' && steps.cache.outputs.stale != 'true'
        with:
          path: site
      - name: GitHub Pagesに公開
        if: steps.plan.outputs.run == 'true' && steps.cache.outputs.stale != 'true'
        id: deployment
        uses: actions/deploy-pages@v4
