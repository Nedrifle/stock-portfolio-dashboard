name: 株価取得とGitHub Pages公開
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      symbols:
        description: '追加取得する証券コード（例：7203.T,6758.T）。株数や取得価額は入力しません。'
        required: false
        default: ''
  schedule:
    - cron: '17 9 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stockfolio-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 計算と株価変換のテスト
        run: |
          node --test tests/*.test.js
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Yahooから過去5年の日次終値を取得
        env:
          REQUESTED_SYMBOLS: ${{ inputs.symbols || '' }}
        run: python3 scripts/update_prices.py
      - name: 公開株価キャッシュと取得対象コードだけを保存
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/quotes.json market-symbols.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update public daily closing prices'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: GitHub Pagesに公開
        id: deployment
        uses: actions/deploy-pages@v4
